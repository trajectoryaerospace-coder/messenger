<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secret Messaging Hub</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    body { 
      /* Pink and Yellow Gradient Theme */
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      background-image: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
      
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 15px; 
      overflow: hidden;
      position: relative;
    }

    /* --- Background Sunflowers --- */
    .sunflower-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .sunflower {
      position: absolute;
      width: 120px;
      height: 120px;
      opacity: 0.8;
      animation: bloomRotate 20s infinite linear, floatAround 30s infinite ease-in-out;
    }

    .sunflower svg {
      width: 100%;
      height: 100%;
    }

    .sf-1 { top: 10%; left: 10%; animation-delay: 0s, -5s; width: 140px; height: 140px;}
    .sf-2 { top: 70%; left: 15%; animation-delay: -2s, -12s; width: 100px; height: 100px;}
    .sf-3 { top: 20%; left: 80%; animation-delay: -4s, -20s; width: 160px; height: 160px;}
    .sf-4 { top: 75%; left: 75%; animation-delay: -6s, -8s; width: 110px; height: 110px;}
    .sf-5 { top: 45%; left: 50%; animation-delay: -8s, -2s; width: 90px; height: 90px; opacity: 0.5;}

    @keyframes bloomRotate {
      0% { transform: scale(0.8) rotate(0deg); }
      50% { transform: scale(1.1) rotate(180deg); }
      100% { transform: scale(0.8) rotate(360deg); }
    }

    @keyframes floatAround {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(20px, -30px); }
      50% { transform: translate(-20px, 20px); }
      75% { transform: translate(30px, 30px); }
    }

    /* --- Prettier UI Elements --- */
    .card { 
      background: rgba(255, 255, 255, 0.55); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px; 
      padding: 30px; 
      width: 100%; 
      max-width: 420px; 
      box-shadow: 0 12px 32px rgba(255, 100, 150, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.7);
      z-index: 10;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header-bar h2 {
      margin: 0;
    }

    .btn-switch {
      background: rgba(255, 255, 255, 0.7);
      color: #ff6b6b;
      border: 1px solid #ff9a9e;
      padding: 6px 12px;
      font-size: 12px;
      margin-bottom: 0;
      width: auto;
      border-radius: 20px;
      box-shadow: none;
    }

    .btn-switch:hover {
      background: #ff9a9e;
      color: white;
      transform: none;
      box-shadow: none;
    }

    h2, h3 { text-align: center; margin-top: 0; color: #ff6b6b; font-weight: 700; }
    h3 { color: #f7b731; font-size: 1.2rem; margin-bottom: 10px; text-shadow: 1px 1px 1px rgba(0,0,0,0.05);}
    
    input, textarea, button { 
      width: 100%; 
      margin-bottom: 18px; 
      border-radius: 12px; 
      border: none; 
      outline: none; 
      font-size: 16px; 
      transition: all 0.3s ease;
    }

    input, textarea { 
      background: rgba(255, 255, 255, 0.8); 
      color: #555; 
      padding: 14px; 
      border: 1px solid #ffe0e6;
    }
    
    input:focus, textarea:focus {
      border-color: #ff9a9e;
      background: rgba(255, 255, 255, 1);
      box-shadow: 0 0 10px rgba(255, 154, 158, 0.3);
    }

    textarea { resize: vertical; min-height: 90px; }

    button { 
      background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%);
      color: #fff; 
      padding: 15px; 
      font-weight: bold; 
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer; 
      box-shadow: 0 4px 15px rgba(255, 110, 130, 0.3);
    }
    
    button:hover {
      box-shadow: 0 6px 20px rgba(255, 110, 130, 0.5);
      transform: translateY(-2px);
    }

    button:active { transform: scale(0.98) translateY(1px); opacity: 0.9; }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .box { 
      background: rgba(255, 255, 255, 0.4); 
      border: 1px solid rgba(255, 255, 255, 0.5); 
      border-radius: 16px; 
      padding: 18px; 
      margin-bottom: 25px; 
    }

    .status-badge { 
      display: block; 
      text-align: center; 
      font-size: 18px; 
      font-weight: bold; 
      padding: 12px; 
      border-radius: 12px; 
      text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
    }
    
    .status-new { 
      background: #edfff4; 
      color: #27ae60; 
      border: 2px solid #2ecc71;
      animation: pulse 1.5s infinite;
    }
    
    .status-none { 
      background: #fdfdfd; 
      color: #95a5a6; 
      border: 2px solid #bdc3c7;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
      100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
    }

    /* Modal Styling for Password Box */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex; justify-content: center; align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="sunflower-area">
    <svg style="display: none;">
      <symbol id="icon-sunflower" viewBox="0 0 100 100">
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(0 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(30 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(60 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(90 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(120 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(150 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(180 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(210 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(240 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(270 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(300 50 50)"/>
        <ellipse rx="8" ry="25" cx="50" cy="25" fill="#fbc531" transform="rotate(330 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(15 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(45 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(75 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(105 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(135 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(165 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(195 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(225 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(255 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(285 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(315 50 50)"/>
        <ellipse rx="5" ry="18" cx="50" cy="30" fill="#f1c40f" transform="rotate(345 50 50)"/>
        <circle cx="50" cy="50" r="15" fill="#654321" stroke="#3d2a13" stroke-width="2"/>
        <circle cx="50" cy="50" r="10" fill="#4b321a" stroke="#3d2a13" stroke-width="1" stroke-dasharray="2 2"/>
      </symbol>
    </svg>

    <div class="sunflower sf-1"><svg><use xlink:href="#icon-sunflower"/></svg></div>
    <div class="sunflower sf-2"><svg><use xlink:href="#icon-sunflower"/></svg></div>
    <div class="sunflower sf-3"><svg><use xlink:href="#icon-sunflower"/></svg></div>
    <div class="sunflower sf-4"><svg><use xlink:href="#icon-sunflower"/></svg></div>
    <div class="sunflower sf-5"><svg><use xlink:href="#icon-sunflower"/></svg></div>
  </div>

  <div class="card">
    <div id="login-screen">
      <h2>🌸 Welcome 🌸</h2>
      <p style="text-align: center; color: #888; margin-bottom: 20px;">Enter <strong>Z</strong> for Zanieke or <strong>A</strong> for Ayushman</p>
      <input type="text" id="login-input" placeholder="Type Z or A..." maxlength="1" style="text-align: center; text-transform: uppercase;" />
      <button onclick="login()">Enter App</button>
    </div>

    <div id="app-screen" class="hidden">
      <div class="header-bar">
        <h2 id="user-title"></h2>
        <button class="btn-switch" onclick="openPasswordModal()">⚙️ Switch User</button>
      </div>
      
      <div class="box">
        <h3>1. Send Message 🌻</h3>
        <textarea id="message-input" placeholder="Type your secret message here..."></textarea>
        <button id="send-btn" onclick="sendMessage()">Send Message</button>
      </div>

      <div class="box">
        <h3>2. Inbox Status 💌</h3>
        <div id="status-indicator" class="status-badge status-none">No New Messages</div>
        <br />
        <button id="bt-btn" onclick="connectBluetooth()">Connect ESP32 Bluetooth</button>
      </div>
    </div>
  </div>

  <div id="password-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="color: #ff6b6b; margin-bottom: 10px;">Enter Password</h3>
      <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Please enter the password to change user or sign out.</p>
      <input type="password" id="pass-input" placeholder="Password..." style="margin-bottom: 15px;" />
      <button onclick="verifyPassword()" style="margin-bottom: 10px;">Confirm</button>
      <button onclick="closePasswordModal()" style="background: #ccc; color: #333; margin-bottom: 0;">Cancel</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCwIxU8JqTcGWwQGP6pVZCGs0jQ3SRsivY",
      authDomain: "counter-6a15a.firebaseapp.com",
      databaseURL: "https://counter-6a15a-default-rtdb.firebaseio.com",
      projectId: "counter-6a15a",
      storageBucket: "counter-6a15a.firebasestorage.app",
      messagingSenderId: "296332301805",
      appId: "1:296332301805:web:7dac60e469a81b86b743e4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = ""; 
    let recipient = "";
    let latestMessage = "";
    let hasNewMessage = false;

    const BLE_SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const BLE_CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // AUTO LOGIN CHECK ON PAGE LOAD
    window.addEventListener("DOMContentLoaded", () => {
      const savedInput = localStorage.getItem("savedUserChoice");
      if (savedInput) {
        processLogin(savedInput);
      }
    });

    window.login = function() {
      const input = document.getElementById("login-input").value.trim().toUpperCase();
      processLogin(input);
    };

    function processLogin(input) {
      if (input === 'Z') {
        currentUser = "Zanieke";
        recipient = "Ayushman";
      } else if (input === 'A') {
        currentUser = "Ayushman";
        recipient = "Zanieke";
      } else {
        alert("Invalid input! Type 'Z' or 'A'.");
        return;
      }

      localStorage.setItem("savedUserChoice", input);

      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("app-screen").classList.remove("hidden");
      document.getElementById("user-title").innerText = "Hi, " + currentUser + "!";

      listenForMessages();
    }

    // PASSWORD PROTECTED SIGN-OUT / SWITCH USER
    window.openPasswordModal = function() {
      document.getElementById("pass-input").value = "";
      document.getElementById("password-modal").classList.remove("hidden");
    };

    window.closePasswordModal = function() {
      document.getElementById("password-modal").classList.add("hidden");
    };

    window.verifyPassword = function() {
      const pass = document.getElementById("pass-input").value;
      if (pass === "ilovezansm") {
        localStorage.removeItem("savedUserChoice");
        document.getElementById("login-input").value = "";
        
        closePasswordModal();
        document.getElementById("app-screen").classList.add("hidden");
        document.getElementById("login-screen").classList.remove("hidden");
      } else {
        alert("Incorrect Password!");
      }
    };

    window.sendMessage = function() {
      const textInput = document.getElementById("message-input");
      const sendBtn = document.getElementById("send-btn");
      const text = textInput.value.trim();
      
      if (!text) return;

      sendBtn.disabled = true;
      sendBtn.innerText = "Sending...";

      set(ref(db, 'inbox/' + recipient), {
        text: text,
        isNew: true
      }).then(() => {
        textInput.value = "";

        const originalText = "Send Message";
        const originalBg = sendBtn.style.background;
        
        sendBtn.innerText = "Sent! ✔️";
        sendBtn.style.background = "linear-gradient(45deg, #2ecc71 0%, #27ae60 100%)"; 
        sendBtn.style.boxShadow = "0 4px 15px rgba(46, 204, 113, 0.4)";

        setTimeout(() => {
          sendBtn.innerText = originalText;
          sendBtn.style.background = originalBg; 
          sendBtn.style.boxShadow = ""; 
          sendBtn.disabled = false;
        }, 1200);
      }).catch((error) => {
        console.error("Firebase error:", error);
        alert("Failed to send message. Check console.");
        sendBtn.disabled = false;
        sendBtn.innerText = "Send Message";
      });
    };

    function listenForMessages() {
      const myInboxRef = ref(db, 'inbox/' + currentUser);
      onValue(myInboxRef, (snapshot) => {
        const data = snapshot.val();
        const badge = document.getElementById("status-indicator");
        if (data && data.isNew) {
          hasNewMessage = true;
          latestMessage = data.text;
          badge.innerText = "NEW MESSAGE RECEIVED! 📩";
          badge.className = "status-badge status-new";
        } else {
          hasNewMessage = false;
          badge.innerText = "No New Messages";
          badge.className = "status-badge status-none";
        }
      });
    }

    // BLUETOOTH CONNECTION WITH VISUAL BUTTON ANIMATION (1.2 SECONDS)
    window.connectBluetooth = async function() {
      const btBtn = document.getElementById("bt-btn");

      if (!hasNewMessage) {
        alert("No new message to transmit!");
        return;
      }

      try {
        const originalText = "Connect ESP32 Bluetooth";
        const originalBg = btBtn.style.background;

        btBtn.disabled = true;
        btBtn.innerText = "Connecting...";

        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [BLE_SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(BLE_SERVICE_UUID);
        const characteristic = await service.getCharacteristic(BLE_CHAR_UUID);

        const encoder = new TextEncoder();
        await characteristic.writeValue(encoder.encode(latestMessage));

        // Clear 'isNew' status in Firebase
        set(ref(db, 'inbox/' + currentUser), {
          text: latestMessage,
          isNew: false
        });

        device.gatt.disconnect();

        // 🟢 Visual Button Feedback for 1.2 Seconds
        btBtn.innerText = "Transferred! ✔️";
        btBtn.style.background = "linear-gradient(45deg, #2ecc71 0%, #27ae60 100%)";
        btBtn.style.boxShadow = "0 4px 15px rgba(46, 204, 113, 0.4)";

        setTimeout(() => {
          btBtn.innerText = originalText;
          btBtn.style.background = originalBg;
          btBtn.style.boxShadow = "";
          btBtn.disabled = false;
        }, 1200);

      } catch (err) {
        console.error(err);
        btBtn.innerText = "Connect ESP32 Bluetooth";
        btBtn.disabled = false;
        
        // Show alert only if user didn't intentionally cancel the pairing popup
        if (err.name !== "NotFoundError") {
          alert("Bluetooth Error: " + err.message);
        }
      }
    };
  </script>
</body>
</html>
